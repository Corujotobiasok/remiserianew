<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GCHU - Login Chofer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
      }
      body {
        background: #eef0f3;
        color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        background: white;
        border: 1px solid #111;
        padding: 25px;
        width: 360px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
      }
      .head b {
        background: #0a1a6b;
        color: white;
        padding: 8px 6px;
        font-size: 14px;
      }
      input {
        width: 100%;
        border: 1px solid #111;
        padding: 10px;
        margin: 8px 0;
        font-size: 12px;
      }
      .btn-blue {
        background: #0a1a6b;
        color: white;
        border: 1px solid #0a1a6b;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 12px;
        width: 100%;
        font-weight: bold;
      }
      .pill {
        font-size: 10px;
        color: #666;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="head">
        <b>GCHU</b>
        <div>
          <div style="font-weight: bold; font-size: 14px">LOGIN CHOFER</div>
          <div style="font-size: 10px; color: #666">
            SISTEMA V2.4.1 • MODO LOCAL
          </div>
        </div>
      </div>
      <input id="email" placeholder="Email - Ej: jorge@test.com" />
      <input id="password" type="password" placeholder="Password" />
      <button class="btn-blue" onclick="login()">[ ENTRAR ]</button>
      <div class="pill" id="msg"></div>
      <div style="margin-top: 15px; font-size: 11px">
        <a href="../login.html" style="color: #0a1a6b">[ VOLVER A CENTRAL ]</a>
      </div>
    </div>
    <script src="login_user.js"></script>
  </body>
</html>
