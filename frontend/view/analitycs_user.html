<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GCHU - Analytics Chofer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
      }
      body {
        background: #eef0f3;
        color: #111;
      }
      header {
        background: white;
        border-bottom: 2px solid #111;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo b {
        background: #0a1a6b;
        color: white;
        padding: 8px 6px;
        font-size: 14px;
      }
      .pill {
        border: 1px solid #111;
        padding: 6px 10px;
        background: white;
        font-size: 12px;
        cursor: pointer;
      }
      main {
        max-width: 1050px;
        margin: 25px auto;
        padding: 0 15px;
      }
      .box {
        background: white;
        border: 1px solid #111;
        padding: 15px;
        margin-bottom: 15px;
      }
      .big {
        font-size: 22px;
        font-weight: bold;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #999;
        padding: 8px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <b>GCHU</b>
        <div>
          <div style="font-weight: bold; font-size: 14px">
            ANALITICS CHOFER - <span id="nombre">...</span>
          </div>
          <div style="font-size: 10px; color: #666">
            SISTEMA V2.4.1 • MODO CHOFER
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 8px">
        <div class="pill" onclick="location.href = 'dashboard_user.html'">
          [ VOLVER AL DASHBOARD ]
        </div>
        <div class="pill" onclick="logout()">[ SALIR ]</div>
      </div>
    </header>

    <main>
      <div class="box">
        <div style="display: flex; justify-content: space-between">
          <b>■ RESUMEN HOY - <span id="fecha"></span></b
          ><span style="font-size: 11px" id="estado"></span>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
          "
        >
          <div
            style="border: 1px solid #111; padding: 12px; text-align: center"
          >
            <div style="font-size: 10px">VIAJES</div>
            <div class="big" id="hoyViajes">0</div>
          </div>
          <div
            style="border: 1px solid #111; padding: 12px; text-align: center"
          >
            <div style="font-size: 10px">BRUTO TOTAL</div>
            <div class="big" id="hoyBruto">$0</div>
          </div>
          <div
            style="
              border: 1px solid #111;
              background: #111;
              color: white;
              padding: 12px;
              text-align: center;
            "
          >
            <div style="font-size: 10px">NETO ( - $4000 BASE )</div>
            <div class="big" id="hoyNeto">$0</div>
          </div>
        </div>
      </div>

      <div class="box">
        <b>■ HISTORIAL COMPLETO DE HOY</b>
        <table>
          <thead style="background: #111; color: white">
            <tr>
              <th>Hora</th>
              <th>Cliente</th>
              <th>Origen -> Destino</th>
              <th>Precio</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="hist"></tbody>
        </table>
      </div>
    </main>

    <script src="analitycs_user.js"></script>
  </body>
</html>
